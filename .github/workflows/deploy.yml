name: Build and deploy Hesab Sarraf preview

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-web-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public deployment repository
        uses: actions/checkout@v4

      - name: Validate private source token
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: |
          test -n "$PRIVATE_SOURCE_TOKEN" || { echo "Missing PRIVATE_SOURCE_TOKEN"; exit 1; }

      - name: Fetch approved source from private repository
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: |
          AUTH_HEADER="$(printf 'x-access-token:%s' "$PRIVATE_SOURCE_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH_HEADER" clone \
            --depth 1 --branch delivery/v21-independent \
            https://github.com/roohalla372/q7v-n4x-k9p2-z8m61.git private-source

      - name: Verify preview banner is present
        working-directory: private-source
        run: |
          grep -Fq 'پیش‌نمایش' src/App.jsx || {
            echo "Build blocked: the preview-only label is missing."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure public deployment path
        working-directory: private-source
        run: |
          sed -i 's|/q7v-n4x-k9p2-z8m61/|/hisabsarraf-new-tg/|g' vite.config.js

      - name: Install dependencies
        working-directory: private-source
        run: npm install

      - name: Build isolated preview (no real database)
        working-directory: private-source
        env:
          VITE_SUPABASE_URL: https://preview-disabled.invalid
          VITE_SUPABASE_ANON_KEY: preview-only-no-database-connection
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: private-source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish preview website
        id: deployment
        uses: actions/deploy-pages@v4
